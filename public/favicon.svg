  <line x1="180" y1="320" x2="230" y2="320" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
  <line x1="155" y1="360" x2="215" y2="360" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>

  <!-- Bubbles -->
  <circle cx="320" cy="340" r="8" fill="white" opacity="0.65"/>
  <circle cx="345" cy="325" r="5" fill="white" opacity="0.65"/>

  <!-- Brand Typography -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#E2E8F0" text-anchor="middle" letter-spacing="4">MADA</text>
  <text x="256" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="3">QUÍMICOS</text>
</svg>
