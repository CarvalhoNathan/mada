      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="liqGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="#1F2937" stroke-width="4"/>

  <!-- Liquid inside Beaker -->
  <path d="M 155 300 L 357 300 L 394 370 A 22 22 0 0 1 372 394 L 140 394 A 22 22 0 0 1 118 370 Z" fill="url(#liqGrad)"/>
  <line x1="155" y1="300" x2="357" y2="300" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>

  <!-- Beaker Outline -->
